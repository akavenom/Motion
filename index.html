<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Tulip Emergence - Motion Graphics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Plus Jakarta Sans & Playfair Display for cinematic feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0914;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        /* Custom Glassmorphism UI */
        .glass-panel {
            background: rgba(18, 16, 32, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        .glass-btn:active {
            transform: translateY(1px);
        }
        .glass-btn.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }
        /* Range Scrubber Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            transition: background 0.3s;
        }
        input[type=range]:hover::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.28);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        /* Fade animations */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="relative w-full h-full text-white overflow-hidden select-none">

    <!-- Canvas Background Animation Layer -->
    <canvas id="motionCanvas" class="absolute inset-0 w-full h-full block z-0 cursor-crosshair"></canvas>

    <!-- Floating Settings Toggle Button (Bottom Right) -->
    <button id="btnToggleControls" title="Show / Hide Settings" aria-label="Toggle Controls" class="fixed bottom-5 right-5 z-30 glass-panel glass-btn p-3.5 rounded-full text-white/80 hover:text-white focus:outline-none flex items-center justify-center transition-all duration-300">
        <!-- Sliders / Settings Icon -->
        <svg id="iconSettings" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
        </svg>
        <!-- Close Icon (hidden initially) -->
        <svg id="iconCloseControls" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>

    <!-- Floating Glass UI Controls (Hidden by default, toggled via button) -->
    <div id="controlsPanel" class="absolute bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-20 w-[92%] max-w-3xl glass-panel rounded-3xl p-4 md:p-5 text-white/90 transition-all duration-500 opacity-0 pointer-events-none translate-y-6">
        
        <!-- Scrubber Header & Timeline Marks -->
        <div class="flex items-center justify-between mb-2 text-xs text-white/60 font-medium px-1">
            <span class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Bloom Progress
            </span>
            <div class="flex gap-4 text-[11px] text-white/40 hidden md:flex">
                <span id="mark-sprout" class="transition-colors">0% Sprout</span>
                <span id="mark-stem" class="transition-colors">25% Stem</span>
                <span id="mark-unfurl" class="transition-colors">45% Leaf</span>
                <span id="mark-bud" class="transition-colors">65% Bud</span>
                <span id="mark-bloom" class="transition-colors">100% Bloom</span>
            </div>
            <span id="timeDisplay" class="font-mono text-white/80">0.0s / 20s</span>
        </div>

        <!-- Scrubber Range Slider -->
        <div class="relative w-full mb-4 px-1">
            <input type="range" id="bloomScrubber" min="0" max="1000" value="0" step="1">
            <!-- Phase Divider Dots along track -->
            <div class="absolute top-1/2 -translate-y-1/2 left-0 right-0 pointer-events-none px-2 flex justify-between opacity-30">
                <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
            </div>
        </div>

        <!-- Main Interactive Button Controls -->
        <div class="flex flex-wrap items-center justify-between gap-3 pt-1 border-t border-white/10">
            
            <!-- Left: Play/Pause & Replay -->
            <div class="flex items-center gap-2">
                <button id="btnPlayPause" title="Play / Pause" class="glass-btn p-3 rounded-full text-white focus:outline-none flex items-center justify-center">
                    <!-- Play Icon -->
                    <svg id="iconPlay" class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <!-- Pause Icon (hidden initially) -->
                    <svg id="iconPause" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <button id="btnReplay" title="Restart Emergence" class="glass-btn p-3 rounded-full text-white/80 hover:text-white focus:outline-none flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>

                <!-- Speed Selector Toggle -->
                <div class="flex items-center bg-black/20 p-1 rounded-2xl border border-white/10 text-xs ml-1">
                    <button data-speed="0.5" class="speed-btn glass-btn px-2.5 py-1 rounded-xl text-white/70 hover:text-white text-[11px] font-medium">0.5x</button>
                    <button data-speed="1.0" class="speed-btn glass-btn active px-2.5 py-1 rounded-xl text-white text-[11px] font-medium">1x</button>
                    <button data-speed="1.5" class="speed-btn glass-btn px-2.5 py-1 rounded-xl text-white/70 hover:text-white text-[11px] font-medium">1.5x</button>
                    <button data-speed="2.0" class="speed-btn glass-btn px-2.5 py-1 rounded-xl text-white/70 hover:text-white text-[11px] font-medium">2x</button>
                </div>
            </div>

            <!-- Right: Theme Palette Switcher -->
            <div class="flex items-center gap-1.5 bg-black/20 p-1.5 rounded-2xl border border-white/10">
                <span class="text-[11px] text-white/40 uppercase tracking-wider font-semibold px-2 hidden sm:inline">Palette</span>
                
                <button data-theme="crimson" title="Crimson Velvet" class="theme-btn w-7 h-7 rounded-full relative transition-transform hover:scale-110 flex items-center justify-center border-2 border-white/80 shadow-md" style="background: linear-gradient(135deg, #900c3f, #ff65a3)">
                </button>
                <button data-theme="golden" title="Golden Dawn" class="theme-btn w-7 h-7 rounded-full relative transition-transform hover:scale-110 flex items-center justify-center border border-white/20" style="background: linear-gradient(135deg, #d97736, #ffe66d)">
                </button>
                <button data-theme="violet" title="Midnight Violet" class="theme-btn w-7 h-7 rounded-full relative transition-transform hover:scale-110 flex items-center justify-center border border-white/20" style="background: linear-gradient(135deg, #7c3aed, #38bdf8)">
                </button>
                <button data-theme="sakura" title="Blush Sakura" class="theme-btn w-7 h-7 rounded-full relative transition-transform hover:scale-110 flex items-center justify-center border border-white/20" style="background: linear-gradient(135deg, #b85b79, #ffc6ff)">
                </button>
            </div>

        </div>
    </div>

    <!-- Interactive Hint Toast (disappears on mouse move/click) -->
    <div id="interactiveHint" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 glass-panel px-4 py-2 rounded-full text-xs text-white/70 flex items-center gap-2 pointer-events-none transition-opacity duration-700 opacity-90">
        <svg class="w-4 h-4 text-emerald-400 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
        </svg>
        <span>Move mouse to stir the breeze. Touch or click anywhere to bloom a hibiscus!</span>
    </div>

    <!-- JavaScript Canvas & Physics Engine -->
    <script>
        /**
         * CINEMATIC TULIP EMERGENCE MOTION GRAPHICS ENGINE
         * High-performance procedural Canvas rendering with dynamic lighting, math Bezier growth curves,
         * wind physics, dewdrops, and interactive motion graphic accents.
         */

        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');

        // Color Palettes Data
        const THEMES = {
            crimson: {
                name: "Crimson Velvet",
                skyTop: [15, 9, 24],
                skyMid: [45, 19, 44],
                skyBottom: [128, 19, 54],
                groundTop: [35, 14, 25],
                groundBottom: [12, 5, 10],
                stem: ["#2d5a27", "#4e8e45", "#81b276"],
                leaf: ["#23471f", "#3e7037", "#629b5a"],
                petalOuter: ["#7a0832", "#a80e44"],
                petalMid: ["#c70039", "#ee4540"],
                petalInner: ["#ff5722", "#ffc107"],
                stamen: "#ffe66d",
                glow: "rgba(255, 101, 163, 0.4)",
                particleColor: ["#ff9ebb", "#ffd700", "#ff65a3", "#ffffff"]
            },
            golden: {
                name: "Golden Dawn",
                skyTop: [13, 27, 42],
                skyMid: [27, 38, 59],
                skyBottom: [224, 169, 109],
                groundTop: [42, 30, 20],
                groundBottom: [15, 10, 6],
                stem: ["#436100", "#709200", "#aacc00"],
                leaf: ["#314700", "#577300", "#86a61a"],
                petalOuter: ["#b85c1d", "#d97736"],
                petalMid: ["#f4a261", "#e76f51"],
                petalInner: ["#ffe66d", "#ffffff"],
                stamen: "#ffffff",
                glow: "rgba(255, 230, 109, 0.4)",
                particleColor: ["#ffe66d", "#f4a261", "#ffffff", "#ffda99"]
            },
            violet: {
                name: "Midnight Violet",
                skyTop: [9, 10, 15],
                skyMid: [18, 21, 38],
                skyBottom: [67, 56, 202],
                groundTop: [22, 18, 40],
                groundBottom: [8, 6, 15],
                stem: ["#134e4a", "#2dd4bf", "#99f6e4"],
                leaf: ["#0f3d3a", "#14b8a6", "#5eead4"],
                petalOuter: ["#4c1d95", "#6d28d9"],
                petalMid: ["#7c3aed", "#c084fc"],
                petalInner: ["#e879f9", "#38bdf8"],
                stamen: "#38bdf8",
                glow: "rgba(168, 85, 247, 0.45)",
                particleColor: ["#c084fc", "#e879f9", "#38bdf8", "#ffffff"]
            },
            sakura: {
                name: "Blush Sakura",
                skyTop: [29, 30, 44],
                skyMid: [61, 52, 77],
                skyBottom: [243, 197, 197],
                groundTop: [40, 32, 45],
                groundBottom: [18, 15, 22],
                stem: ["#365e49", "#609975", "#a3d9b1"],
                leaf: ["#294a39", "#4d8262", "#84be99"],
                petalOuter: ["#9e4b65", "#b85b79"],
                petalMid: ["#e8998d", "#ffc6ff"],
                petalInner: ["#fff0f5", "#ffffff"],
                stamen: "#ffd1dc",
                glow: "rgba(255, 198, 255, 0.4)",
                particleColor: ["#ffc6ff", "#ffd1dc", "#ffffff", "#fbcfe8"]
            }
        };

        let currentThemeKey = 'crimson';
        let currentTheme = THEMES[currentThemeKey];

        // Global Animation State
        let progress = 0; // 0.0 to 1.0
        let isPlaying = true;
        let speedMultiplier = 1.0;
        const DURATION_SECONDS = 14; // Tuned 14s emergence at 1x speed
        let lastTime = performance.now();

        // Mouse & Interactive Sway Physics
        let mouseX = 0;
        let mouseY = 0;
        let targetSway = 0;
        let currentSway = 0;
        let swayVelocity = 0;
        let userInteracted = false;

        // Visual Particles & Systems
        const pollenParticles = [];
        const backgroundStars = [];
        const hibiscusBlooms = [];
        const kineticRings = [];

        // Multi-Tulip Cluster Definition (7 Botanically Accurate Tulips)
        const TULIP_CLUSTER = [
            // Background Depth Tulips (Rendered First)
            { xRatio: 0.35, heightRatio: 0.31, scale: 0.74, bloomOffset: 0.08, swayPhase: 3.7, bend: -18, hueShift: -8 },
            { xRatio: 0.64, heightRatio: 0.33, scale: 0.76, bloomOffset: 0.06, swayPhase: 4.4, bend: 15, hueShift: 6 },
            
            // Midground Tulips
            { xRatio: 0.40, heightRatio: 0.38, scale: 0.88, bloomOffset: 0.03, swayPhase: 0.8, bend: -22, hueShift: -4 },
            { xRatio: 0.60, heightRatio: 0.40, scale: 0.90, bloomOffset: 0.02, swayPhase: 1.5, bend: 20, hueShift: 4 },
            
            // Foreground Side Tulips
            { xRatio: 0.27, heightRatio: 0.35, scale: 0.82, bloomOffset: 0.07, swayPhase: 2.2, bend: -30, hueShift: -10 },
            { xRatio: 0.73, heightRatio: 0.36, scale: 0.84, bloomOffset: 0.05, swayPhase: 2.9, bend: 28, hueShift: 8 },

            // Hero Center Tulip (Foreground - Rendered Last)
            { xRatio: 0.50, heightRatio: 0.45, scale: 1.02, bloomOffset: 0.0,  swayPhase: 0.0, bend: 2, hueShift: 0 }
        ];

        // High DPI Canvas Setup
        let dpr = window.devicePixelRatio || 1;
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            initStars();
        }

        window.addEventListener('resize', resizeCanvas);

        // Initialize Ambient Background Stars/Motes
        function initStars() {
            backgroundStars.length = 0;
            const count = Math.floor((width * height) / 9000);
            for (let i = 0; i < count; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.85,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.2,
                    speedY: Math.random() * 0.15 + 0.05,
                    pulse: Math.random() * Math.PI * 2
                });
            }
        }

        // Particle Class for Interactive Pollen & Emergence Dust
        class PollenParticle {
            constructor(x, y, isBurst = false) {
                this.x = x;
                this.y = y;
                this.radius = isBurst ? Math.random() * 3 + 1.5 : Math.random() * 2 + 0.8;
                const angle = Math.random() * Math.PI * 2;
                const speed = isBurst ? Math.random() * 2.5 + 0.5 : Math.random() * 0.8 + 0.2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - (isBurst ? 0.5 : 0.8);
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.008;
                const colors = currentTheme.particleColor;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.wobble = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx + Math.sin(this.wobble) * 0.3;
                this.y += this.vy;
                this.wobble += 0.05;
                this.life -= this.decay;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Animated Procedural Hibiscus Flower (Spawned on Touch / Click)
        class HibiscusBloom {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.age = 0;
                this.maxAge = 4.5; // Lifetime before complete fade
                this.rotation = Math.random() * Math.PI * 2;
                this.maxRadius = Math.random() * 9 + 21; // Half-size petal radius
                this.swayOffset = Math.random() * Math.PI * 2;
                this.colorTheme = currentTheme;
                this.burstDone = false;
            }

            update(dt, timeSec) {
                this.age += dt;

                // Emit pollen burst upon initial bloom opening
                if (!this.burstDone && this.age > 0.12) {
                    this.burstDone = true;
                    for (let i = 0; i < 10; i++) {
                        pollenParticles.push(new PollenParticle(
                            this.x + (Math.random() - 0.5) * 12,
                            this.y + (Math.random() - 0.5) * 12,
                            true
                        ));
                    }
                }
            }

            draw(ctx, timeSec) {
                // Eased unfolding growth
                const bloomProgress = Math.min(1, this.age / 0.75);
                const easeBloom = 1 - Math.pow(1 - bloomProgress, 3); // Cubic ease-out

                // Fade out near end of life
                let alpha = 1;
                if (this.age > this.maxAge - 1.2) {
                    alpha = (this.maxAge - this.age) / 1.2;
                }
                if (alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, alpha);

                // Gentle hovering sway physics
                const swayX = Math.sin(timeSec * 2 + this.swayOffset) * 3;
                const swayY = Math.cos(timeSec * 1.5 + this.swayOffset) * 1.5;
                ctx.translate(this.x + swayX, this.y + swayY);
                ctx.rotate(this.rotation + Math.sin(timeSec * 1.2 + this.swayOffset) * 0.08);

                const currentR = this.maxRadius * easeBloom;

                // 1. Draw 5 Broad Ruffled Overlapping Petals
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    ctx.save();
                    ctx.rotate(angle);

                    // Multi-stop silky radial gradient: dark throat to rich theme colors
                    const grad = ctx.createRadialGradient(0, 0, currentR * 0.08, 0, -currentR * 0.5, currentR * 1.15);
                    grad.addColorStop(0, '#4a0013'); // Deep crimson throat
                    grad.addColorStop(0.22, this.colorTheme.petalMid[0]);
                    grad.addColorStop(0.68, this.colorTheme.petalInner[0]);
                    grad.addColorStop(1, '#ffffff');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-currentR * 0.6, -currentR * 0.35, -currentR * 0.7, -currentR * 0.98, 0, -currentR);
                    ctx.bezierCurveTo(currentR * 0.7, -currentR * 0.98, currentR * 0.6, -currentR * 0.35, 0, 0);
                    ctx.fill();

                    // Delicate petal veins (scaled for half size)
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
                    ctx.lineWidth = 0.6;
                    for (let v = -2; v <= 2; v += 2) {
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(v * 2, -currentR * 0.5, v * 4, -currentR * 0.88);
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // 2. Velvet Throat Shadow Rim
                ctx.fillStyle = "#32000a";
                ctx.beginPath();
                ctx.arc(0, 0, currentR * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // 3. Iconic Hibiscus Stamen Column (Scaled for half size)
                if (easeBloom > 0.25) {
                    const stamenLen = currentR * 1.05 * easeBloom;
                    ctx.save();
                    ctx.rotate(-0.3); // Characteristic slanted protrusion

                    // Slender curved pistil column
                    ctx.strokeStyle = "rgba(255, 225, 200, 0.95)";
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(4, -stamenLen * 0.6, 2.5, -stamenLen);
                    ctx.stroke();

                    // Golden Anthers along upper shaft
                    ctx.fillStyle = "#ffe66d";
                    ctx.shadowColor = "#ffe66d";
                    ctx.shadowBlur = 4;
                    for (let a = 0.35; a <= 0.88; a += 0.14) {
                        const py = -stamenLen * a;
                        ctx.beginPath();
                        ctx.arc(-1.3, py, 1.0, 0, Math.PI * 2);
                        ctx.arc(1.8, py, 1.0, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 5 Velvety Crimson Stigma Tips at end of pistil
                    ctx.fillStyle = "#e11d48";
                    ctx.shadowColor = "#f43f5e";
                    ctx.shadowBlur = 5;
                    const tipX = 2.5, tipY = -stamenLen;
                    for (let s = 0; s < 5; s++) {
                        const sAng = (s * Math.PI * 2) / 5;
                        const sx = tipX + Math.cos(sAng) * 2.2;
                        const sy = tipY + Math.sin(sAng) * 2.2;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }

                ctx.restore();
            }
        }

        // Kinetic Motion Graphic Ring around Bud/Bloom
        class KineticRing {
            constructor(x, y, maxR = 120) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = maxR;
                this.alpha = 0.6;
                this.rotation = Math.random() * Math.PI;
            }
            update() {
                this.radius += 1.2;
                this.alpha -= 0.008;
                this.rotation += 0.01;
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 8]);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Outer accent tick marks
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 0.5);
                ctx.stroke();
                ctx.restore();
            }
        }

        // Color helper: Interpolate color arrays
        function lerpColor(c1, c2, factor) {
            return [
                Math.round(c1[0] + (c2[0] - c1[0]) * factor),
                Math.round(c1[1] + (c2[1] - c1[1]) * factor),
                Math.round(c1[2] + (c2[2] - c1[2]) * factor)
            ];
        }

        function rgbStr(c, a = 1) {
            return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
        }

        // Track triggered kinetic ring milestones
        const triggeredMilestones = new Set();

        // Cubic Bezier interpolation helper for stem leaf attachments
        function getBezierPoint(t, p0, p1, p2, p3) {
            const u = 1 - t;
            const tt = t * t;
            const uu = u * u;
            const uuu = uu * u;
            const ttt = tt * t;
            return {
                x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
                y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
            };
        }

        // Emit a burst of glowing dust/pollen particles from the soil
        function spawnSoilBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                pollenParticles.push(new PollenParticle(
                    x + (Math.random() - 0.5) * 90,
                    y - Math.random() * 12,
                    true
                ));
            }
        }

        // Trigger kinetic botanical rings at key growth milestones
        function triggerMilestones() {
            const milestones = [0.25, 0.5, 0.75, 0.95];
            milestones.forEach(m => {
                if (progress >= m && !triggeredMilestones.has(m)) {
                    triggeredMilestones.add(m);
                    const ringX = width / 2 + currentSway;
                    const ringY = height * (0.82 - 0.42 * Math.min(1, progress / 0.52));
                    kineticRings.push(new KineticRing(ringX, ringY, 90 + m * 60));
                }
            });
        }

        /**
         * 1. ATMOSPHERIC SKY & VOLUMETRIC LIGHT RAYS
         */
        function drawAtmosphere(timeSec) {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.85);
            const warmShift = Math.min(1, progress * 1.1);
            const topCol = lerpColor(currentTheme.skyTop, currentTheme.skyMid, warmShift * 0.35);
            const midCol = lerpColor(currentTheme.skyMid, currentTheme.skyBottom, warmShift * 0.25);

            skyGrad.addColorStop(0, rgbStr(topCol, 1));
            skyGrad.addColorStop(0.55, rgbStr(midCol, 1));
            skyGrad.addColorStop(1, rgbStr(currentTheme.skyBottom, 0.85));

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // Soft diagonal volumetric light beams
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (let i = 0; i < 3; i++) {
                const drift = Math.sin(timeSec * 0.35 + i * 2.1) * 60;
                const beamX = width * (0.25 + i * 0.25) + drift;
                const beamGrad = ctx.createLinearGradient(beamX, 0, beamX + 140, height * 0.85);
                beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
                beamGrad.addColorStop(0.6, currentTheme.glow.replace(/[\d.]+\)$/, '0.07)'));
                beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = beamGrad;
                ctx.beginPath();
                ctx.moveTo(beamX - 50, 0);
                ctx.lineTo(beamX + 60, 0);
                ctx.lineTo(beamX + 260, height * 0.85);
                ctx.lineTo(beamX + 50, height * 0.85);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        /**
         * 2. AMBIENT FLOATING STARS & LUMINESCENT MOTES
         */
        function drawBackgroundStars() {
            ctx.save();
            for (let i = 0; i < backgroundStars.length; i++) {
                const s = backgroundStars[i];
                s.y -= s.speedY;
                s.pulse += 0.025;
                if (s.y < -5) {
                    s.y = height * 0.82;
                    s.x = Math.random() * width;
                }
                const twinkle = s.alpha * (0.55 + 0.45 * Math.sin(s.pulse));
                ctx.globalAlpha = Math.max(0, twinkle);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        /**
         * 3. SOIL HORIZON, MIST LAYER & EMERGENCE MOUNDS
         */
        function drawGround(groundY, stemBaseX) {
            ctx.save();

            // Soft horizon mist
            const mistGrad = ctx.createLinearGradient(0, groundY - 70, 0, groundY + 15);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(1, currentTheme.glow.replace(/[\d.]+\)$/, '0.18)'));
            ctx.fillStyle = mistGrad;
            ctx.fillRect(0, groundY - 70, width, 85);

            // Rolling soil horizon
            const groundGrad = ctx.createLinearGradient(0, groundY - 15, 0, height);
            groundGrad.addColorStop(0, rgbStr(currentTheme.groundTop, 1));
            groundGrad.addColorStop(1, rgbStr(currentTheme.groundBottom, 1));

            ctx.fillStyle = groundGrad;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 10);
            ctx.quadraticCurveTo(width * 0.25, groundY - 12, stemBaseX, groundY);
            ctx.quadraticCurveTo(width * 0.75, groundY - 12, width, groundY + 10);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

            // Subtle soil mounds under each tulip base
            ctx.fillStyle = rgbStr(currentTheme.groundBottom, 0.75);
            TULIP_CLUSTER.forEach(t => {
                const mx = width * t.xRatio;
                ctx.beginPath();
                ctx.ellipse(mx, groundY + 3, 22 * t.scale, 6 * t.scale, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        /**
         * MAIN RENDER ENGINE
         */
        function drawScene(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            // Advance Progress if Playing
            if (isPlaying) {
                progress += (dt / DURATION_SECONDS) * speedMultiplier;
                if (progress > 1.0) {
                    progress = 1.0;
                }
                updateUIProgress();
            }

            // Smooth Sway Inertia (Wind Physics)
            const timeSec = timestamp * 0.001;
            const naturalWind = Math.sin(timeSec * 1.2) * 12 + Math.cos(timeSec * 2.1) * 6;
            const mouseForce = (mouseX - width / 2) * 0.06;
            targetSway = naturalWind + (userInteracted ? mouseForce : 0);
            
            // Spring damping math
            swayVelocity += (targetSway - currentSway) * 0.05;
            swayVelocity *= 0.88;
            currentSway += swayVelocity;

            // Milestone Kinetic Rings
            triggerMilestones();

            // Clear Screen
            ctx.clearRect(0, 0, width, height);

            // 1. Volumetric Atmospheric Sky & Sunbeams
            drawAtmosphere(timeSec);

            // 2. Floating Background Motes/Stars
            drawBackgroundStars();

            // 3. Soil Horizon & Emergence Soil Mound
            const groundY = height * 0.82;
            const stemBaseX = width / 2;
            drawGround(groundY, stemBaseX);

            // 4. Multi-Tulip Cluster Growth (Exact Chalice Anatomy)
            if (progress > 0.01) {
                drawTulipCluster(groundY, timeSec);
            }

            // 5. Particles (Pollen, Hibiscus Blooms, Kinetic Rings)
            drawParticles(dt, timeSec);

            requestAnimationFrame(drawScene);
        }

        /**
         * RENDER MULTIPLE TULIPS (CLUSTER DEPLOYMENT)
         */
        function drawTulipCluster(groundY, timeSec) {
            TULIP_CLUSTER.forEach(tData => {
                // Calculate individual staggered progress
                const indivProgress = Math.max(0, Math.min(1, (progress - tData.bloomOffset) / (1 - tData.bloomOffset)));
                if (indivProgress > 0) {
                    const baseX = width * tData.xRatio;
                    drawSingleExactTulip(baseX, groundY, tData, indivProgress, timeSec);
                }
            });
        }

        /**
         * DRAW SINGLE BOTANICALLY ACCURATE TULIP
         */
        function drawSingleExactTulip(baseX, baseY, tData, indivProgress, timeSec) {
            ctx.save();

            const maxStemHeight = height * tData.heightRatio;
            const currentStemHeight = maxStemHeight * Math.min(1, indivProgress / 0.52);

            // Sway with Phase Offset
            const stemSway = currentSway * (0.6 + tData.scale * 0.4) + Math.sin(timeSec * 1.6 + tData.swayPhase) * 4;
            const bendOffset = tData.bend * Math.min(1, indivProgress / 0.5);

            // Cubic Bezier Stem Control Points
            const p0 = { x: baseX, y: baseY };
            const p1 = { x: baseX + (stemSway * 0.2) + bendOffset * 0.3, y: baseY - currentStemHeight * 0.38 };
            const p2 = { x: baseX + (stemSway * 0.7) + bendOffset, y: baseY - currentStemHeight * 0.72 };
            const p3 = { x: baseX + stemSway + bendOffset, y: baseY - currentStemHeight };

            // 1. Broad Glaucous Clasping Leaves (Bottom of Stem)
            if (indivProgress > 0.18) {
                const leafProgress = Math.min(1, (indivProgress - 0.18) / 0.4);
                drawExactTulipLeaves(p0, p1, p2, p3, leafProgress, tData.scale, timeSec + tData.swayPhase);
            }

            // 2. Smooth Cylindrical 3D Stem
            drawExactStem(p0, p1, p2, p3, tData.scale);

            // 3. Iconic Goblet/Chalice Flower Head
            if (indivProgress > 0.12) {
                const flowerProgress = Math.min(1, (indivProgress - 0.12) / 0.88);
                drawExactTulipHead(p3.x, p3.y, flowerProgress, tData.scale, timeSec + tData.swayPhase);
            }

            ctx.restore();
        }

        /**
         * BOTANICAL TULIP STEM
         */
        function drawExactStem(p0, p1, p2, p3, scale) {
            ctx.save();
            const thickness = (7 * scale);
            
            const stemGrad = ctx.createLinearGradient(p0.x, p0.y, p3.x, p3.y);
            stemGrad.addColorStop(0, currentTheme.stem[0]);
            stemGrad.addColorStop(0.5, currentTheme.stem[1]);
            stemGrad.addColorStop(1, currentTheme.stem[2]);

            ctx.strokeStyle = stemGrad;
            ctx.lineWidth = thickness;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
            ctx.stroke();

            // 3D Specular Highlight Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.32)";
            ctx.lineWidth = Math.max(1, thickness * 0.22);
            ctx.beginPath();
            ctx.moveTo(p0.x - 1.2, p0.y);
            ctx.bezierCurveTo(p1.x - 1.2, p1.y, p2.x - 1.2, p2.y, p3.x - 1.2, p3.y);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * BOTANICAL TULIP LEAVES (Lanceolate, Clasping, Parallel Veins)
         */
        function drawExactTulipLeaves(p0, p1, p2, p3, leafProgress, scale, phaseTime) {
            ctx.save();

            const attach1 = getBezierPoint(0.2, p0, p1, p2, p3);
            const attach2 = getBezierPoint(0.38, p0, p1, p2, p3);

            const leafScale = Math.sin(leafProgress * Math.PI * 0.5) * scale;
            const leafLen = 130 * leafScale;

            // Left Clasping Leaf
            ctx.save();
            ctx.translate(attach1.x, attach1.y);
            ctx.rotate(-Math.PI * 0.32 + Math.sin(phaseTime * 1.1) * 0.03);

            const leafGradL = ctx.createLinearGradient(0, 0, -leafLen * 0.7, -leafLen);
            leafGradL.addColorStop(0, currentTheme.leaf[0]);
            leafGradL.addColorStop(0.5, currentTheme.leaf[1]);
            leafGradL.addColorStop(1, currentTheme.leaf[2]);

            ctx.fillStyle = leafGradL;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-leafLen * 0.35, -leafLen * 0.5, -leafLen * 0.7, -leafLen * 0.85, -leafLen * 0.4, -leafLen);
            ctx.bezierCurveTo(-leafLen * 0.15, -leafLen * 0.6, -10, -leafLen * 0.25, 0, 0);
            ctx.fill();

            // Glaucous Parallel Vein Lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-leafLen * 0.3, -leafLen * 0.5, -leafLen * 0.6, -leafLen * 0.8, -leafLen * 0.4, -leafLen);
            ctx.stroke();
            ctx.restore();

            // Right Clasping Leaf
            ctx.save();
            ctx.translate(attach2.x, attach2.y);
            ctx.rotate(Math.PI * 0.28 - Math.sin(phaseTime * 1.1) * 0.03);

            const leafGradR = ctx.createLinearGradient(0, 0, leafLen * 0.7, -leafLen);
            leafGradR.addColorStop(0, currentTheme.leaf[0]);
            leafGradR.addColorStop(0.5, currentTheme.leaf[1]);
            leafGradR.addColorStop(1, currentTheme.leaf[2]);

            ctx.fillStyle = leafGradR;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(leafLen * 0.35, -leafLen * 0.5, leafLen * 0.7, -leafLen * 0.85, leafLen * 0.38, -leafLen);
            ctx.bezierCurveTo(leafLen * 0.15, -leafLen * 0.6, 10, -leafLen * 0.25, 0, 0);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(leafLen * 0.3, -leafLen * 0.5, leafLen * 0.6, -leafLen * 0.8, leafLen * 0.38, -leafLen);
            ctx.stroke();
            ctx.restore();

            ctx.restore();
        }

        /**
         * BOTANICAL TULIP GOBLET / CHALICE FLOWER HEAD (6 Overlapping Tepals)
         */
        function drawExactTulipHead(x, y, flowerProgress, scale, phaseTime) {
            ctx.save();
            ctx.translate(x, y);

            const swayRot = Math.sin(phaseTime * 1.4) * 0.05;
            ctx.rotate(swayRot);

            // Scale head smoothly from pointed shoot bud to full chalice
            const headScale = (0.3 + flowerProgress * 0.7) * scale;
            ctx.scale(headScale, headScale);

            // Bloom opening amount (starts opening at 0.4 progress, keeps tight cup shape)
            const cupOpen = Math.max(0, (flowerProgress - 0.38) / 0.62);

            // Soft Aura Glow around Flower Cup
            if (flowerProgress > 0.4) {
                const glowR = 45 + cupOpen * 30;
                const glowGrad = ctx.createRadialGradient(0, -35, 5, 0, -35, glowR);
                glowGrad.addColorStop(0, currentTheme.glow);
                glowGrad.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(0, -35, glowR, 0, Math.PI * 2);
                ctx.fill();
            }

            // Smooth Green Sepal Base
            ctx.fillStyle = currentTheme.stem[1];
            ctx.beginPath();
            ctx.ellipse(0, 2, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            if (flowerProgress < 0.38) {
                // Tightly Closed Pointed Green/Blushed Ovoid Bud
                drawPointedTulipBud(flowerProgress);
            } else {
                // 6-Tepal Layered Chalice Structure (3 Back Outer Tepals, Pistil/Stamens, 3 Front Tepals)
                
                // --- A. BACK OUTER TEPALS ---
                drawExactTepal(-16 * cupOpen, -58, 22, 68, -0.18 * cupOpen, currentTheme.petalOuter, 0.92);
                drawExactTepal(16 * cupOpen, -58, 22, 68, 0.18 * cupOpen, currentTheme.petalOuter, 0.92);
                drawExactTepal(0, -62, 24, 72, 0, currentTheme.petalOuter, 0.88);

                // --- B. CENTRAL PISTIL & STAMENS (Inside Cup) ---
                if (cupOpen > 0.15) {
                    drawTulipInternalAnthers(cupOpen);
                }

                // --- C. FRONT INNER & MAIN TEPALS (Creating Plump Chalice Cup) ---
                drawExactTepal(-24 * cupOpen, -52, 26, 74, -0.26 * cupOpen, currentTheme.petalMid, 0.98);
                drawExactTepal(24 * cupOpen, -52, 26, 74, 0.26 * cupOpen, currentTheme.petalMid, 0.98);

                // Center Main Front Tepal (Fullest spoon shape wrapping the front)
                drawExactTepal(0, -48, 32, 78, 0, currentTheme.petalInner, 1.0, true);

                if (cupOpen > 0.6) {
                    drawDewdrops(cupOpen);
                }
            }

            ctx.restore();
        }

        /**
         * POINTED EMBRYONIC TULIP BUD
         */
        function drawPointedTulipBud(progress) {
            ctx.save();
            const budGrad = ctx.createLinearGradient(0, 5, 0, -60);
            budGrad.addColorStop(0, currentTheme.stem[1]);
            budGrad.addColorStop(0.35, currentTheme.petalOuter[0]);
            budGrad.addColorStop(1, currentTheme.petalMid[0]);

            ctx.fillStyle = budGrad;
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.bezierCurveTo(-18, -15, -16, -48, 0, -62);
            ctx.bezierCurveTo(16, -48, 18, -15, 0, 5);
            ctx.fill();

            // Vertical seam line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.lineTo(0, -62);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * BOTANICAL TEPAL / PETAL (Obovate Tulip Cup Spoon-Shape)
         */
        function drawExactTepal(xOffset, yOffset, width, height, rotateAngle, colorArray, alpha = 1.0, isFront = false) {
            ctx.save();
            ctx.translate(xOffset, 0);
            ctx.rotate(rotateAngle);
            ctx.globalAlpha = alpha;

            // Rich multi-stop gradient from dark velvety base to silky tip
            const pGrad = ctx.createLinearGradient(0, 8, 0, -height);
            pGrad.addColorStop(0, "#2a020d"); // Deep base shadow
            pGrad.addColorStop(0.18, colorArray[0]);
            pGrad.addColorStop(0.65, colorArray[1] || colorArray[0]);
            pGrad.addColorStop(1, "#fff5f8");

            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.moveTo(0, 6);
            // Obovate tulip curve: wide plump base curving inward at rounded tip
            ctx.bezierCurveTo(-width * 1.15, -height * 0.30, -width * 0.95, -height * 0.88, 0, -height);
            ctx.bezierCurveTo(width * 0.95, -height * 0.88, width * 1.15, -height * 0.30, 0, 6);
            ctx.closePath();
            ctx.fill();

            // Fine Parallel Vertical Vein Striations
            ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
            ctx.lineWidth = 0.7;
            for (let v = -2; v <= 2; v += 2) {
                ctx.beginPath();
                ctx.moveTo(v * 2, 0);
                ctx.quadraticCurveTo(v * (width * 0.35), -height * 0.5, v * 3, -height * 0.92);
                ctx.stroke();
            }

            // Specular Ridge Highlight for Waxy Tulip Surface
            if (isFront) {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(-width * 0.3, -height * 0.2);
                ctx.quadraticCurveTo(-width * 0.5, -height * 0.6, 0, -height * 0.95);
                ctx.stroke();
            }

            ctx.restore();
        }

        /**
         * PISTIL & STAMENS INSIDE TULIP CUP
         */
        function drawTulipInternalAnthers(cupOpen) {
            ctx.save();
            const vis = Math.min(1.0, (cupOpen - 0.15) / 0.5);
            ctx.globalAlpha = vis;

            // 3-Lobed Central Stigma
            ctx.fillStyle = "#81b276";
            ctx.beginPath();
            ctx.ellipse(0, -28, 4, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Dark-tipped Tulip Stamens (6 surrounding filaments)
            const angles = [-0.35, -0.2, -0.08, 0.08, 0.2, 0.35];
            ctx.fillStyle = "#1e1018"; // Dark chocolate / charcoal anther tips
            ctx.strokeStyle = "rgba(255, 240, 200, 0.8)";
            ctx.lineWidth = 1.4;

            angles.forEach(ang => {
                ctx.save();
                ctx.rotate(ang);
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(0, -32);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(0, -35, 2, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.restore();
        }

        function drawDewdrops(bloomAngle) {
            ctx.save();
            ctx.globalAlpha = Math.min(0.8, (bloomAngle - 0.6) * 2);

            const drops = [
                { x: -14, y: -35, r: 2.8 },
                { x: 18, y: -25, r: 3.2 },
                { x: -4, y: -52, r: 2.2 }
            ];

            drops.forEach(d => {
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        /**
         * 6. DRAW PARTICLES, HIBISCUS BLOOMS & KINETIC RINGS
         */
        function drawParticles(dt, timeSec) {
            // A. Pollen Motes
            for (let i = pollenParticles.length - 1; i >= 0; i--) {
                const p = pollenParticles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) pollenParticles.splice(i, 1);
            }

            // Continuous gentle pollen emission once bloomed
            if (progress > 0.65 && Math.random() < 0.35) {
                const flowerX = width / 2 + currentSway;
                const flowerY = height * 0.4;
                pollenParticles.push(new PollenParticle(flowerX + (Math.random() - 0.5) * 60, flowerY + (Math.random() - 0.5) * 40));
            }

            // B. Procedural Hibiscus Blooms (Touch / Click Effect)
            for (let i = hibiscusBlooms.length - 1; i >= 0; i--) {
                const h = hibiscusBlooms[i];
                h.update(dt, timeSec);
                h.draw(ctx, timeSec);
                if (h.age >= h.maxAge) hibiscusBlooms.splice(i, 1);
            }

            // C. Kinetic Rings
            for (let i = kineticRings.length - 1; i >= 0; i--) {
                const kr = kineticRings[i];
                kr.update();
                kr.draw(ctx);
                if (kr.alpha <= 0) kineticRings.splice(i, 1);
            }
        }

        /**
         * UI CONTROLS & EVENT LISTENERS
         */
        const bloomScrubber = document.getElementById('bloomScrubber');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const btnReplay = document.getElementById('btnReplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const hintToast = document.getElementById('interactiveHint');
        const controlsPanel = document.getElementById('controlsPanel');
        const btnToggleControls = document.getElementById('btnToggleControls');
        const iconSettings = document.getElementById('iconSettings');
        const iconCloseControls = document.getElementById('iconCloseControls');
        let controlsVisible = false;

        // Show / Hide Settings & Palette Panel
        btnToggleControls.addEventListener('click', () => {
            controlsVisible = !controlsVisible;
            if (controlsVisible) {
                controlsPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-6');
                controlsPanel.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                iconSettings.classList.add('hidden');
                iconCloseControls.classList.remove('hidden');
            } else {
                controlsPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-6');
                controlsPanel.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                iconSettings.classList.remove('hidden');
                iconCloseControls.classList.add('hidden');
            }
        });

        // Scrubber manual drag
        bloomScrubber.addEventListener('input', (e) => {
            progress = parseFloat(e.target.value) / 1000;
            triggeredMilestones.forEach(m => {
                if (progress < m) triggeredMilestones.delete(m);
            });
            updateUIProgress();
        });

        // Play/Pause toggle
        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            iconPlay.classList.toggle('hidden', isPlaying);
            iconPause.classList.toggle('hidden', !isPlaying);
        });

        // Replay button
        btnReplay.addEventListener('click', () => {
            progress = 0;
            triggeredMilestones.clear();
            isPlaying = true;
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            updateUIProgress();
            spawnSoilBurst(width / 2, height * 0.82);
        });

        // Speed buttons
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                speedMultiplier = parseFloat(btn.dataset.speed);
            });
        });

        // Palette / Theme Switcher
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => {
                    b.classList.remove('border-2', 'border-white/80', 'shadow-md');
                    b.classList.add('border', 'border-white/20');
                });
                btn.classList.remove('border-white/20');
                btn.classList.add('border-2', 'border-white/80', 'shadow-md');

                currentThemeKey = btn.dataset.theme;
                currentTheme = THEMES[currentThemeKey];

                // Spawn theme hibiscus bloom at center screen
                hibiscusBlooms.push(new HibiscusBloom(width / 2, height / 2));
            });
        });

        // Update Scrubber UI & Progress
        function updateUIProgress() {
            bloomScrubber.value = Math.floor(progress * 1000);
            const currentTime = (progress * DURATION_SECONDS).toFixed(1);
            timeDisplay.innerText = `${currentTime}s / ${DURATION_SECONDS}s`;

            if (progress < 0.20) {
                setActiveTimelineMark('sprout');
            } else if (progress < 0.45) {
                setActiveTimelineMark('stem');
            } else if (progress < 0.65) {
                setActiveTimelineMark('unfurl');
            } else if (progress < 0.85) {
                setActiveTimelineMark('bud');
            } else {
                setActiveTimelineMark('bloom');
            }
        }

        function setActiveTimelineMark(activeId) {
            ['sprout', 'stem', 'unfurl', 'bud', 'bloom'].forEach(id => {
                const el = document.getElementById(`mark-${id}`);
                if (el) {
                    if (id === activeId) {
                        el.className = "text-white font-semibold transition-colors";
                    } else {
                        el.className = "text-white/40 transition-colors";
                    }
                }
            });
        }

        // Touch & Mouse Interactivity (Spawns Animated Hibiscus Flowers)
        function spawnHibiscusAt(x, y) {
            hibiscusBlooms.push(new HibiscusBloom(x, y));
            if (hintToast) hintToast.style.opacity = '0';
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            userInteracted = true;

            if (Math.random() < 0.3) {
                pollenParticles.push(new PollenParticle(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                userInteracted = true;
                if (Math.random() < 0.4) {
                    pollenParticles.push(new PollenParticle(mouseX, mouseY));
                }
            }
        });

        window.addEventListener('click', (e) => {
            // Ignore clicks inside the controls panel or toggle button
            if (e.target && e.target.closest('#controlsPanel, #btnToggleControls')) return;
            spawnHibiscusAt(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target && e.target.closest('#controlsPanel, #btnToggleControls')) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                spawnHibiscusAt(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Initialize Engine
        window.onload = function() {
            resizeCanvas();
            iconPlay.classList.add('hidden');
            iconPause.classList.remove('hidden');
            requestAnimationFrame(drawScene);
        };
    </script>
</body>
</html>
